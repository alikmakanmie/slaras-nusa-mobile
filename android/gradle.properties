org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# -Djava.net.preferIPv4Stack=true WAJIB di sandbox Hatch: JVM default membuka soket
# AF_INET6 (::ffff:127.0.0.1) dan koneksi loopback IPv4-mapped tak pernah selesai
# di sandbox ini -> klien Gradle tak bisa konek ke daemon (daemon idle 2 mnt lalu mati).
# Dengan flag ini soket jadi AF_INET murni dan build jalan.
android.useAndroidX=true
# android.newDsl=false DIHAPUS (Dhodi, 6 Nov 2026): AGP 9+ hanya membaca new DSL;
# flag false dari template membuat plugin Flutter (shared_preferences_android, dll)
# gagal konfigurasi ('kotlin-android plugin requires one of the Android Gradle plugins').
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Daemon Kotlin (JVM terpisah, tak mewarisi org.gradle.jvmargs): butuh flag IPv4
# yang sama + heap kecil (RAM VM ~1,5 GB bebas) agar bisa start & konek.
kotlin.daemon.jvm.options=-Xmx768m -Djava.net.preferIPv4Stack=true
